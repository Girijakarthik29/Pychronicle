<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<h1> even or odd</h1>
<body>
    <script>
        let num=Number(prompt("enter a number"));
        if(num%2==0){
            document.write("even number");
        }
        else{
            document.write("odd number");
        }
        
    </script>
    
</body>
</html>
